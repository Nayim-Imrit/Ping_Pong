<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ping Pong</title>
  <style>
    :root {
      --bg: #0b0d10;
      --panel: #12151a;
      --line: #e8e8e8;
      --muted: #9aa3ad;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(1200px 600px at 50% -10%, #1a2230 0%, transparent 55%),
        var(--bg);
      color: var(--line);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    .wrap {
      width: min(92vw, 960px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    h1 {
      font-size: clamp(1.4rem, 3vw, 2rem);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      font-weight: 700;
    }

    .hint {
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
      line-height: 1.5;
    }

    .stage {
      position: relative;
      width: 100%;
      background: var(--panel);
      border: 2px solid #2a313c;
      border-radius: 8px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #0d1117;
      cursor: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: rgba(8, 10, 14, 0.78);
      text-align: center;
      padding: 24px;
    }

    .overlay.hidden {
      display: none;
    }

    .overlay h2 {
      font-size: clamp(1.8rem, 5vw, 3rem);
      letter-spacing: 0.08em;
    }

    .overlay p {
      color: var(--muted);
      max-width: 28rem;
    }

    button {
      margin-top: 8px;
      border: 1px solid #e8e8e8;
      background: transparent;
      color: #e8e8e8;
      font-size: 1rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 10px 22px;
      cursor: pointer;
      border-radius: 4px;
    }

    button:hover,
    button:focus-visible {
      background: #e8e8e8;
      color: #0b0d10;
      outline: none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Ping Pong</h1>
    <p class="hint">Arrow keys or mouse to move. Space to start / pause. First to 5 wins.</p>
    <div class="stage">
      <canvas id="game" width="900" height="560" aria-label="Ping Pong game canvas"></canvas>
      <div id="overlay" class="overlay">
        <h2 id="overlayTitle">Ping Pong</h2>
        <p id="overlayText">Press Start or Space to play.</p>
        <button id="actionBtn" type="button">Start</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const overlay = document.getElementById("overlay");
      const overlayTitle = document.getElementById("overlayTitle");
      const overlayText = document.getElementById("overlayText");
      const actionBtn = document.getElementById("actionBtn");

      const WIN_SCORE = 5;
      const PADDLE_W = 12;
      const PADDLE_H = 96;
      const BALL_SIZE = 12;
      const PADDLE_SPEED = 480;
      const AI_MAX_SPEED = 330;
      const BASE_BALL_SPEED = 340;
      const SPEED_GAIN = 22;
      const MAX_BALL_SPEED = 780;

      const state = {
        running: false,
        paused: false,
        over: false,
        playerScore: 0,
        aiScore: 0,
        keys: { up: false, down: false },
        mouseY: null,
        lastTime: 0
      };

      const player = {
        x: 28,
        y: canvas.height / 2 - PADDLE_H / 2,
        w: PADDLE_W,
        h: PADDLE_H
      };

      const ai = {
        x: canvas.width - 28 - PADDLE_W,
        y: canvas.height / 2 - PADDLE_H / 2,
        w: PADDLE_W,
        h: PADDLE_H,
        targetY: canvas.height / 2 - PADDLE_H / 2,
        reaction: 0
      };

      const ball = {
        x: canvas.width / 2,
        y: canvas.height / 2,
        vx: 0,
        vy: 0,
        size: BALL_SIZE,
        speed: BASE_BALL_SPEED
      };

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function resetBall(direction) {
        ball.x = canvas.width / 2;
        ball.y = canvas.height / 2;
        ball.speed = BASE_BALL_SPEED;
        const angle = (Math.random() * 0.7 - 0.35);
        ball.vx = Math.cos(angle) * ball.speed * direction;
        ball.vy = Math.sin(angle) * ball.speed;
      }

      function resetMatch() {
        state.playerScore = 0;
        state.aiScore = 0;
        state.over = false;
        state.paused = false;
        player.y = canvas.height / 2 - PADDLE_H / 2;
        ai.y = canvas.height / 2 - PADDLE_H / 2;
        ai.targetY = ai.y;
        resetBall(-1);
      }

      function showOverlay(title, text, buttonLabel) {
        overlayTitle.textContent = title;
        overlayText.textContent = text;
        actionBtn.textContent = buttonLabel;
        overlay.classList.remove("hidden");
      }

      function hideOverlay() {
        overlay.classList.add("hidden");
      }

      function startGame() {
        if (state.over) {
          resetMatch();
        }
        if (!state.running) {
          resetMatch();
          state.running = true;
        }
        state.paused = false;
        hideOverlay();
        state.lastTime = performance.now();
      }

      function pauseGame() {
        if (!state.running || state.over) return;
        state.paused = true;
        showOverlay("Paused", "Press Space or Resume to continue.", "Resume");
      }

      function togglePause() {
        if (!state.running || state.over) {
          startGame();
          return;
        }
        if (state.paused) {
          startGame();
        } else {
          pauseGame();
        }
      }

      function endGame(playerWon) {
        state.over = true;
        state.running = false;
        state.paused = false;
        showOverlay(
          playerWon ? "You Win!" : "Game Over",
          playerWon ? "Nice rally. First to 5 is yours." : "The AI reached 5 first.",
          "Restart"
        );
      }

      function bounceFromPaddle(paddle, direction) {
        const paddleCenter = paddle.y + paddle.h / 2;
        const relative = (ball.y - paddleCenter) / (paddle.h / 2);
        const clamped = clamp(relative, -1, 1);
        const maxAngle = Math.PI / 3;
        const angle = clamped * maxAngle;
        ball.speed = Math.min(MAX_BALL_SPEED, ball.speed + SPEED_GAIN);
        ball.vx = Math.cos(angle) * ball.speed * direction;
        ball.vy = Math.sin(angle) * ball.speed;
        ball.x = direction === 1 ? paddle.x + paddle.w + ball.size / 2 : paddle.x - ball.size / 2;
      }

      function collidePaddle(paddle) {
        return (
          ball.x + ball.size / 2 >= paddle.x &&
          ball.x - ball.size / 2 <= paddle.x + paddle.w &&
          ball.y + ball.size / 2 >= paddle.y &&
          ball.y - ball.size / 2 <= paddle.y + paddle.h
        );
      }

      function updateAI(dt) {
        ai.reaction -= dt;
        if (ai.reaction <= 0) {
          const error = (Math.random() - 0.5) * 46;
          ai.targetY = ball.y - ai.h / 2 + error;
          ai.reaction = 0.08 + Math.random() * 0.12;
        }

        const desired = clamp(ai.targetY, 0, canvas.height - ai.h);
        const delta = desired - ai.y;
        const step = AI_MAX_SPEED * dt;
        if (Math.abs(delta) <= step) {
          ai.y = desired;
        } else {
          ai.y += Math.sign(delta) * step;
        }
      }

      function update(dt) {
        if (state.keys.up) player.y -= PADDLE_SPEED * dt;
        if (state.keys.down) player.y += PADDLE_SPEED * dt;
        if (state.mouseY !== null) {
          player.y += (state.mouseY - PADDLE_H / 2 - player.y) * Math.min(1, dt * 14);
        }
        player.y = clamp(player.y, 0, canvas.height - player.h);

        updateAI(dt);

        ball.x += ball.vx * dt;
        ball.y += ball.vy * dt;

        if (ball.y - ball.size / 2 <= 0) {
          ball.y = ball.size / 2;
          ball.vy *= -1;
        } else if (ball.y + ball.size / 2 >= canvas.height) {
          ball.y = canvas.height - ball.size / 2;
          ball.vy *= -1;
        }

        if (ball.vx < 0 && collidePaddle(player)) {
          bounceFromPaddle(player, 1);
        } else if (ball.vx > 0 && collidePaddle(ai)) {
          bounceFromPaddle(ai, -1);
        }

        if (ball.x + ball.size / 2 < 0) {
          state.aiScore += 1;
          if (state.aiScore >= WIN_SCORE) {
            endGame(false);
            return;
          }
          resetBall(1);
        } else if (ball.x - ball.size / 2 > canvas.width) {
          state.playerScore += 1;
          if (state.playerScore >= WIN_SCORE) {
            endGame(true);
            return;
          }
          resetBall(-1);
        }
      }

      function drawCourt() {
        ctx.fillStyle = "#0d1117";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = "#e8e8e8";
        ctx.lineWidth = 3;
        ctx.setLineDash([14, 16]);
        ctx.beginPath();
        ctx.moveTo(canvas.width / 2, 12);
        ctx.lineTo(canvas.width / 2, canvas.height - 12);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = "#e8e8e8";
        ctx.font = "bold 48px 'Segoe UI', sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(String(state.playerScore), canvas.width * 0.28, 62);
        ctx.fillText(String(state.aiScore), canvas.width * 0.72, 62);
      }

      function drawPaddle(paddle) {
        ctx.fillStyle = "#e8e8e8";
        ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
      }

      function drawBall() {
        ctx.fillStyle = "#e8e8e8";
        ctx.fillRect(ball.x - ball.size / 2, ball.y - ball.size / 2, ball.size, ball.size);
      }

      function render() {
        drawCourt();
        drawPaddle(player);
        drawPaddle(ai);
        drawBall();
      }

      function loop(now) {
        const dt = Math.min(0.033, (now - state.lastTime) / 1000 || 0);
        state.lastTime = now;
        if (state.running && !state.paused && !state.over) {
          update(dt);
        }
        render();
        requestAnimationFrame(loop);
      }

      function canvasPoint(event) {
        const rect = canvas.getBoundingClientRect();
        const scaleY = canvas.height / rect.height;
        return (event.clientY - rect.top) * scaleY;
      }

      window.addEventListener("keydown", function (event) {
        if (event.code === "ArrowUp") {
          state.keys.up = true;
          state.mouseY = null;
          event.preventDefault();
        } else if (event.code === "ArrowDown") {
          state.keys.down = true;
          state.mouseY = null;
          event.preventDefault();
        } else if (event.code === "Space") {
          event.preventDefault();
          togglePause();
        }
      });

      window.addEventListener("keyup", function (event) {
        if (event.code === "ArrowUp") state.keys.up = false;
        if (event.code === "ArrowDown") state.keys.down = false;
      });

      canvas.addEventListener("mousemove", function (event) {
        state.mouseY = canvasPoint(event);
      });

      actionBtn.addEventListener("click", function () {
        if (state.over) {
          startGame();
        } else if (state.paused) {
          startGame();
        } else {
          startGame();
        }
      });

      resetMatch();
      showOverlay("Ping Pong", "Press Start or Space to play.", "Start");
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
